databases:
  - name: plataforma-db
    plan: free
    databaseName: plataforma_analise
    user: plataforma_user

services:
  - type: web
    name: plataforma-analise-dados
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: plataforma-db
          property: connectionString
